<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visitas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Visitas Comerciales</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f2e;--navy2:#123247;--teal:#14b8a6;--teal-d:#0d9488;--teal-l:#ccfbf1;
  --bg:#f3f5f7;--card:#fff;--ink:#0f1c26;--mut:#6b7a86;--line:#e5e9ed;
  --venta:#16a34a;--interesado:#0d9488;--seguimiento:#d97706;--sin:#dc2626;--pend:#64748b;
  --r:18px;--sh:0 1px 2px rgba(15,28,38,.04),0 6px 20px rgba(15,28,38,.06);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'General Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:#dfe5ea;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 60px rgba(0,0,0,.08)}

/* Login */
.login{min-height:100vh;background:radial-gradient(120% 80% at 100% 0%,#14b8a6 0%,transparent 55%),radial-gradient(90% 60% at 0% 100%,#1e5a7a 0%,transparent 60%),var(--navy);display:flex;flex-direction:column;justify-content:flex-end;padding:32px 22px calc(32px + var(--safe-b));color:#fff}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:auto;padding-top:calc(20px + var(--safe-t))}
.brand .logo{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.14);display:grid;place-items:center;backdrop-filter:blur(8px)}
.login h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:40px 0 10px}
.login p.sub{color:rgba(255,255,255,.72);margin-bottom:28px;line-height:1.5}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:18px;backdrop-filter:blur(14px)}
.glass input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px;color:#fff;outline:none;margin-bottom:10px}
.glass input::placeholder{color:rgba(255,255,255,.55)}
.glass input:focus{border-color:var(--teal)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-weight:600;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--teal);color:#042f2e}
.btn-g{background:rgba(255,255,255,.1);color:#fff;margin-top:10px}
.btn-d{background:var(--ink);color:#fff}
.btn-s{background:#eef1f4;color:var(--ink)}
.btn-r{background:#fde8e8;color:var(--sin)}
.link{color:rgba(255,255,255,.75);font-size:14px;text-align:center;display:block;width:100%;margin-top:14px}
.demo{margin-top:18px;text-align:center;font-size:14px;color:#5eead4}

/* Header */
.top{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;padding:calc(18px + var(--safe-t)) 20px 70px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.45),transparent 70%);top:-110px;right:-80px}
.top-row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.hello small{display:block;color:rgba(255,255,255,.6);font-size:13px}
.hello b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:600;border:1px solid rgba(255,255,255,.2)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.7);margin-top:14px;position:relative;z-index:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(20,184,166,.25)}
.dot.off{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}

.content{padding:0 16px calc(110px + var(--safe-b));margin-top:-52px;position:relative;z-index:2}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.kpi b{font-size:26px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1}
.kpi span{font-size:13px;color:var(--mut)}
.conv{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-top:10px}
.conv .rb{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bar{height:10px;border-radius:10px;background:#eef1f4;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 4px 10px}
.sec h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sec button{font-size:14px;color:var(--teal-d);font-weight:500}

.task{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:8px;width:100%;text-align:left}
.task .ic{width:38px;height:38px;border-radius:12px;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center}
.task b{font-weight:600;display:block;font-size:14px}.task small{color:var(--mut);font-size:13px}

/* Visit cards */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--sh)}
.search input{flex:1;border:0;outline:0;padding:14px 0;background:none}
.search svg{color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:30px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.day{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 4px 8px}
.v{display:flex;gap:12px;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left;transition:transform .1s}
.v:active{transform:scale(.99)}
.v .thumb{width:54px;height:54px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden}
.v .thumb img{width:100%;height:100%;object-fit:cover}
.v .body{flex:1;min-width:0}
.v .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.v b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v .meta{color:var(--mut);font-size:13px;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.v .note{font-size:13px;color:#3b4a55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.amount{font-weight:600;color:var(--ink)}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--card);display:grid;place-items:center;margin:0 auto 14px;box-shadow:var(--sh);color:var(--teal-d)}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 26px calc(12px + var(--safe-b));background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--mut);font-weight:500;min-width:64px}
.nav button.on{color:var(--ink)}
.nav .fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(145deg,var(--teal),var(--teal-d));color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 10px 24px rgba(13,148,136,.4);min-width:0}
.nav .fab svg{width:26px;height:26px}

/* Sheets */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(11,31,46,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:480px;max-height:94vh;background:var(--bg);border-radius:26px 26px 0 0;overflow-y:auto;transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + var(--safe-b))}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:#cfd6dc;margin:10px auto 4px}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 4px;position:sticky;top:0;background:var(--bg);z-index:2}
.ph h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.x{width:36px;height:36px;border-radius:50%;background:#e6eaee;display:grid;place-items:center}
.pb{padding:8px 18px}
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:4px 16px;margin-bottom:14px}
.field{padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:4px}
.field input,.field textarea{width:100%;border:0;outline:0;background:none;font-size:16px;padding:2px 0}
.field textarea{min-height:84px;resize:none;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.glabel{font-size:13px;font-weight:600;color:var(--mut);margin:4px 4px 8px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg button{padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button i{width:8px;height:8px;border-radius:50%}
.seg button.on{color:#fff}
.photo{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.photo img{width:100%;height:200px;object-fit:cover;display:block}
.photo .acts{display:flex;gap:8px;padding:10px}
.photo .acts button{flex:1}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;border:2px dashed #cdd5dc;border-radius:var(--r);background:var(--card);margin-bottom:14px;width:100%;color:var(--mut)}
.drop .ic{width:52px;height:52px;border-radius:16px;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center}
.drop b{color:var(--ink);font-weight:600}
.btn-sm{padding:11px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}

/* Detail */
.hero{margin:0 18px 14px;border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--sh)}
.hero img{width:100%;max-height:230px;object-fit:cover;display:block;cursor:zoom-in}
.hero .in{padding:16px}
.hero h3{font-size:21px;font-weight:600;letter-spacing:-.01em}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px 14px}
.actions a,.actions button{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none}
.actions .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.actions .dis{opacity:.4;pointer-events:none}
.info{margin:0 18px 14px}
.row-i{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row-i:last-child{border:0}
.row-i svg{color:var(--mut);margin-top:1px}
.row-i small{display:block;color:var(--mut);font-size:12px}
.row-i p{line-height:1.45;white-space:pre-wrap}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:14px}
.viewer img{max-width:94%;max-height:78vh;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;z-index:80;pointer-events:none;display:flex;gap:8px;align-items:center;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dialog{position:fixed;inset:0;z-index:70;background:rgba(11,31,46,.5);display:none;align-items:center;justify-content:center;padding:24px}
.dialog>div{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:340px}
.dialog h4{font-size:18px;margin-bottom:6px}.dialog p{color:var(--mut);margin-bottom:18px;line-height:1.45}
.dialog .bb{display:flex;gap:10px}.dialog .bb button{flex:1}
.loading{min-height:100vh;display:grid;place-items:center;background:var(--navy);color:#fff}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--teal);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:520px){body{padding:0}}

/* ---- tema negro ---- */
:root{--navy:#000;--navy2:#0a0a0a;--bg:#000;--card:#141414;--ink:#f2f4f5;--mut:#8b959c;--line:#262626;--teal-l:rgba(20,184,166,.16);--teal-d:#2dd4bf;--sh:0 0 0 1px #1f1f1f}
html,body{background:#000}
#app{box-shadow:none}
.login{background:radial-gradient(120% 70% at 100% 0%,rgba(20,184,166,.55) 0%,transparent 55%),radial-gradient(90% 50% at 0% 100%,rgba(20,184,166,.18) 0%,transparent 60%),#000}
.top{background:#000}
.top::after{background:radial-gradient(circle,rgba(20,184,166,.35),transparent 70%)}
.btn-d{background:#f2f4f5;color:#000}
.btn-s{background:#1f1f1f;color:var(--ink)}
.btn-r{background:rgba(220,38,38,.16);color:#f87171}
.bar{background:#1f1f1f}
.chip.on{background:var(--teal);color:#042f2e;border-color:var(--teal)}
.v .note{color:#b4bcc2}
.nav{background:rgba(10,10,10,.88);border-top-color:#1f1f1f}
.sheet,.dialog{background:rgba(0,0,0,.7)}
.panel{background:#0a0a0a}.ph{background:#0a0a0a}
.grab{background:#333}.x{background:#1f1f1f;color:var(--ink)}
.drop{border-color:#333}
.dialog>div{background:#161616;color:var(--ink)}
.loading{background:#000}
input,textarea,select{color:var(--ink)}
input::placeholder,textarea::placeholder{color:#5f686e}
input[type=date],input[type=time]{color-scheme:dark}
.search input{color:var(--ink)}
.nav{padding-left:8px;padding-right:8px}.nav button{min-width:58px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sel{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
.sel.on{border-color:var(--teal);background:rgba(20,184,166,.1)}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{appearance:none;-webkit-appearance:none;width:100%;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:13.5px;padding:11px 28px 11px 12px;text-overflow:ellipsis}
.sel select option,.mapsel option{background:#141414;color:#f2f4f5}
.mapsel{width:100%;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px;padding:2px 0;-webkit-appearance:none;appearance:none}
.rb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{background:#1c1c1c;color:#fff;border:1px solid #2e2e2e}
</style>
</head>

<div id="app"><div class="loading"><div class="spin"></div></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<div class="viewer" id="viewer" onclick="this.style.display='none'"><img id="vimg" alt="Tarjeta de visita"><span>Toca para cerrar</span></div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>

/* ---------- foto: comprime a JPEG para guardarla en Firestore (plan gratuito) ---------- */
function compress(file){
  return new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const max = 1000, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      let q = .7, out = c.toDataURL('image/jpeg', q);
      while (out.length > 700000 && q > .3) { q -= .1; out = c.toDataURL('image/jpeg', q); }
      ok(out);
    }; im.onerror = ko; im.src = r.result; };
    r.onerror = ko; r.readAsDataURL(file);
  });
}

async function saveCliente(c){
  if (S.demo) { const i=S.clientes.findIndex(x=>x.id===c.id); i>=0?S.clientes[i]=c:S.clientes.push(c); render(); return; }
  await setDoc(doc(db,'usuarios',S.user.uid,'clientes',c.id), c);
}
async function saveClientesLote(list, onProg){
  if (S.demo) { for (const c of list){ const i=S.clientes.findIndex(x=>x.id===c.id); i>=0?S.clientes[i]=c:S.clientes.push(c);} render(); return; }
  for (let i=0;i<list.length;i+=400){ const b=writeBatch(db); list.slice(i,i+400).forEach(c=>b.set(doc(db,'usuarios',S.user.uid,'clientes',c.id),c)); await b.commit(); onProg && onProg(Math.min(i+400,list.length)); }
}
async function borrarClientesLote(ids){
  if (S.demo) { S.clientes=S.clientes.filter(c=>!ids.includes(c.id)); render(); return; }
  for (let i=0;i<ids.length;i+=400){ const b=writeBatch(db); ids.slice(i,i+400).forEach(id=>b.delete(doc(db,'usuarios',S.user.uid,'clientes',id))); await b.commit(); }
}
const visitasDe = c => S.visitas.filter(v => v.clienteId===c.id || norm(v.cliente)===norm(c.nombre));
function filtrarClientes(){
  const q = norm(S.cq);
  let L = S.clientes.filter(c => (!S.cprov || c.provincia===S.cprov) && (!S.cpob || c.poblacion===S.cpob) && (!S.csec || c.sector===S.csec)
    && (!q || norm([c.nombre,c.contacto,c.direccion,c.poblacion,c.provincia,c.cp,c.sector,c.telefono,c.email].join(' ')).includes(q)));
  if (S.cvis) { L = L.filter(c => { const n = visitasDe(c).length; return S.cvis==='con' ? n>0 : n===0; }); }
  return L.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es',{numeric:true}));
}
const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));

    <button class="drop" onclick="$('impf').click()"><div class="ic">${ic('up')}</div><b>Elegir archivo</b><span style="font-size:13px">Excel o CSV</span></button>
    <button class="btn btn-s" onclick="plantilla()">${ic('down')}Descargar plantilla de ejemplo</button>
    ${S.clientes.length?`<button class="btn btn-r" style="margin-top:10px" onclick="vaciarClientes()">${ic('trash')}Borrar todos los clientes (${S.clientes.length})</button>`:''}`;
  else {
    const prev = I.rows.slice(0,3).map(r=>mapRow(r)).map(c=>`<div class="task" style="display:block"><b>${esc(c.nombre||'(sin nombre)')}</b><small>${esc([fullAddr(c),c.telefono].filter(Boolean).join(' · ')||'—')}</small></div>`).join('');
    body = `<div class="task" style="display:block"><b>${esc(I.name)}</b><small>${I.rows.length} filas encontradas</small></div>
      <div class="glabel">Columnas de tu archivo</div>
      <div class="group">${CF.map(([k,lab])=>`<div class="field"><label>${lab}</label><select class="mapsel" onchange="IM('${k}',this.value)"><option value="">— No importar —</option>${I.headers.map((h,i)=>`<option value="${i}" ${I.map[k]===i?'selected':''}>${esc(h||'Columna '+(i+1))}</option>`).join('')}</select></div>`).join('')}</div>
      <div class="glabel">Vista previa</div>${prev}
      <label class="task" style="gap:10px;cursor:pointer"><input type="checkbox" ${I.upd?'checked':''} onchange="S.imp.upd=this.checked" style="width:20px;height:20px;accent-color:var(--teal)"><span style="font-size:14px">Si un cliente ya existe con el mismo nombre, actualizar sus datos en lugar de duplicarlo</span></label>
      <button class="btn btn-p" id="bimp" style="margin-top:8px" onclick="hacerImport()">${ic('check')}Importar ${I.rows.length} clientes</button>
      <button class="btn btn-s" style="margin-top:10px" onclick="importar()">Elegir otro archivo</button>`;
  }
  $('panel').innerHTML = `<div class="grab"></div><div class="ph"><h2>Importar clientes</h2><button class="x" onclick="closeSheet()" aria-label="Cerrar">${ic('x')}</button></div><div class="pb">${body}</div>`;
}
window.IM = (k,v) => { S.imp.map[k] = v===''?undefined:Number(v); renderImport(); };
const mapRow = r => { const c={}; for (const [k] of CF){ const i=S.imp.map[k]; c[k] = i===undefined ? '' : String(r[i]??'').trim(); } return c; };
function parseCSV(t){
  t = t.replace(/^\ufeff/,''); const first=t.split(/\r?\n/)[0]||''; const d=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<t.length;i++){ const ch=t[i];
    if (q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if (ch==='"') q=true; else if (ch===d){ row.push(cur); cur=''; } else if (ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
let XLSX = null;
document.addEventListener('change', async e => {
  if (e.target.id!=='impf') return; const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try {
    let rows;
    if (/\.(csv|txt)$/i.test(f.name)) { const buf=await f.arrayBuffer(); let t=new TextDecoder('utf-8').decode(buf); if (t.includes('\ufffd')) t=new TextDecoder('windows-1252').decode(buf); rows=parseCSV(t); }
    else { toast('Leyendo Excel…'); if(!XLSX) XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs');
      const wb=XLSX.read(await f.arrayBuffer()); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}); }
    rows = rows.filter(r=>r.some(c=>String(c).trim()));
    if (rows.length<2) return dialog('Archivo vacío','No he encontrado filas con datos debajo de la cabecera.','<button class="btn btn-d" onclick="closeDialog()">Aceptar</button>');
    const headers = rows[0].map(h=>String(h).trim()), map={};
    for (const [k,,syn] of CF){ const ns=syn.map(norm); let i=headers.findIndex(h=>ns.includes(norm(h))); if(i<0) i=headers.findIndex(h=>ns.some(s=>s.length>3&&norm(h).includes(s))); if(i>=0 && !Object.values(map).includes(i)) map[k]=i; }
    if (map.nombre===undefined) map.nombre = 0;
    S.imp = {name:f.name, headers, rows:rows.slice(1), map, upd:true}; renderImport();
  } catch(err){ dialog('No se pudo leer el archivo', err.message, '<button class="btn btn-d" onclick="closeDialog()">Aceptar</button>'); }
});
window.hacerImport = async () => {
  const I=S.imp, byName=new Map(S.clientes.map(c=>[norm(c.nombre),c])), now=new Date().toISOString(), seen=new Set();
  const list=[]; let nuevos=0, act=0;
  for (const r of I.rows){ const c=mapRow(r); if(!c.nombre) continue; const key=norm(c.nombre);
    if (seen.has(key)) continue; seen.add(key);
    const ex = I.upd && byName.get(key);
    if (ex){ act++; const m={...ex}; for(const [k] of CF) if(c[k]) m[k]=c[k]; m.actualizado=now; list.push(m); }
    else { nuevos++; list.push({...c, id:newId(), creado:now, actualizado:now}); } }
  if (!list.length) return dialog('Nada que importar','Ninguna fila tiene nombre de cliente. Revisa qué columna corresponde al nombre.','<button class="btn btn-d" onclick="closeDialog()">Aceptar</button>');
  const b=$('bimp'); b.disabled=true; b.innerHTML='<div class="spin" style="width:20px;height:20px;border-width:2px"></div> Importando…';
  try { await saveClientesLote(list, n=>{ b.innerHTML=`Importando ${n} de ${list.length}…`; });
    closeSheet(); S.cprov=S.cpob=S.csec=S.cvis=S.cq=''; go('clientes');
    toast(`${nuevos} clientes nuevos${act?`, ${act} actualizados`:''}`);
  } catch(e){ b.disabled=false; b.innerHTML='Reintentar'; dialog('No se pudo importar', e.code==='permission-denied'?'Falta dar permiso a la base de datos para guardar clientes.':e.message,'<button class="btn btn-d" onclick="closeDialog()">Aceptar</button>'); }
};
window.vaciarClientes = () => dialog('Borrar todos los clientes', `Se eliminarán ${S.clientes.length} clientes. Las visitas no se borran. No se puede deshacer.`, `<button class="btn btn-s" onclick="closeDialog()">Cancelar</button><button class="btn" style="background:var(--sin);color:#fff" onclick="closeDialog();confVaciar()">Borrar</button>`);
window.confVaciar = async () => { try { await borrarClientesLote(S.clientes.map(c=>c.id)); closeSheet(); toast('Clientes borrados'); } catch(e){ toast('Error: '+e.message,false); } };
window.plantilla = () => {
  const rows=[['Nombre','Contacto','Teléfono','Email','Dirección','CP','Población','Provincia','Sector','Notas'],['Textiles Ejemplo S.L.','Laura Martínez','961234567','laura@ejemplo.es','Av. de la Industria 12','46980','Paterna','Valencia','Textil','Visitar por la mañana']];
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+c+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='plantilla-clientes.csv'; document.body.appendChild(a); a.click(); a.remove();
};

/* ---------- hojas ---------- */
function openSheet(){ $('sheet').classList.add('open'); document.body.style.overflow='hidden'; }
window.closeSheet = () => { $('sheet').classList.remove('open'); document.body.style.overflow=''; S.form=null; S.detail=null; };

/* ---------- exportar ---------- */
window.exportar = () => {
  const h=['Fecha','Hora','Cliente','Contacto','Teléfono','Dirección','Tipo','Resultado','Importe','Notas','Próxima acción','Fecha próxima acción'];
  const rows=[...S.visitas].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(x=>[new Date(x.fecha).toLocaleDateString('es-ES'),fTime(x.fecha),x.cliente,x.contacto,x.telefono,x.direccion,x.tipo,x.resultado,x.importe,x.notas,x.proxAccion,x.proxFecha]);
  const csv='\ufeff'+[h,...rows].map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='visitas.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('Archivo CSV descargado');
};
render();
</script>
